<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Lumina Influence AI">
  <!-- Ícone de aplicativo. O símbolo é recomposto, não apenas encolhido: em
       16px os cinco sinais viram um borrão, então o anel engrossa, os sinais
       caem para três e as pontas crescem. A leitura que precisa sobreviver é
       "íris com sinais saindo". -->
  <defs>
    <linearGradient id="fi-fundo" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1E293B"/>
      <stop offset="1" stop-color="#0B1220"/>
    </linearGradient>
    <linearGradient id="fi-topo" x1="124" y1="256" x2="334" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.05" stop-color="#DDD6FE"/>
      <stop offset="0.36" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#6D28D9"/>
    </linearGradient>
    <linearGradient id="fi-base" x1="124" y1="256" x2="334" y2="332" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.05" stop-color="#DDD6FE"/>
      <stop offset="0.38" stop-color="#8B5CF6"/>
      <stop offset="0.74" stop-color="#0EA5E9"/>
      <stop offset="1" stop-color="#F43F5E"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#fi-fundo)"/>

  <path d="M124 256 A106 106 0 0 1 334.4 237.6" fill="none" stroke="url(#fi-topo)" stroke-width="28" stroke-linecap="round"/>
  <path d="M124 256 A106 106 0 0 0 334.4 274.4" fill="none" stroke="url(#fi-base)" stroke-width="28" stroke-linecap="round"/>

  <g stroke-width="17" stroke-linecap="round" fill="none">
    <path d="M124 256 H400" stroke="#22D3EE"/>
    <path d="M328.9 203.4 L380.1 176.2" stroke="#A78BFA"/>
    <path d="M328.9 308.6 L380.1 335.8" stroke="#FB7185"/>
  </g>
  <g>
    <circle cx="400" cy="256" r="18" fill="#22D3EE"/>
    <circle cx="380.1" cy="176.2" r="18" fill="#A78BFA"/>
    <circle cx="380.1" cy="335.8" r="18" fill="#FB7185"/>
  </g>
  <circle cx="124" cy="256" r="27" fill="#FFFFFF"/>
</svg>
