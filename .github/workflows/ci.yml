# Integração contínua do front-end.
#
# Existe porque a auditoria de 08/09/2026 apontou que este repositório não
# tinha verificação nenhuma no servidor: os 80 testes de ponta a ponta rodavam
# só na máquina do desenvolvedor.
#
# ---------------------------------------------------------------------------
# O que este workflow NÃO faz, e por quê — leia antes de confiar nele
# ---------------------------------------------------------------------------
#
# 1. NÃO roda os testes de ponta a ponta. Eles precisam da pilha inteira de pé:
#    a API, e por trás dela o banco gerenciado. Pôr essa credencial no runner é
#    decisão de quem administra o repositório, não algo que se configura de
#    passagem. Enquanto não houver, a suíte continua sendo responsabilidade de
#    quem faz o push.
#
# 2. NÃO reprova por lint, ainda. A primeira execução do ESLint (09/09/2026)
#    deixou 16 erros de pé, todos de disciplina de hooks — 12
#    `set-state-in-effect`, 2 `immutability`, 1 `refs` e 1 `use-memo`. São
#    achados legítimos, e corrigi-los mexe na estrutura de doze componentes.
#    Ligar o portão antes disso deixaria a verificação vermelha de forma
#    permanente, e verificação sempre vermelha é ignorada tão rápido quanto
#    verificação que nunca reprova.
#
#    O passo roda mesmo assim, com `continue-on-error`, para que a contagem
#    fique visível a cada push e não volte a crescer no escuro. **Quando os 16
#    forem resolvidos, remova o `continue-on-error`** — é isso que transforma
#    este passo em portão.
#
# O que ele faz de verdade é reprovar quando a aplicação não compila, que é o
# defeito que já apareceu neste projeto: import faltando e variável fora de
# escopo derrubam a tela inteira, passam pelo teste de unidade e só aparecem
# quando alguém abre o navegador.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Instalar dependências
        run: npm ci

      # Portão de verdade: build quebrado reprova o workflow.
      - name: Build
        run: npm run build

      # Ainda não é portão — ver a nota 2 no topo do arquivo.
      - name: Lint (contagem visível, sem reprovar)
        run: npm run lint
        continue-on-error: true

  # ---------------------------------------------------------------------------
  # Testes de ponta a ponta
  # ---------------------------------------------------------------------------
  #
  # Nenhum segredo é usado aqui, e isso é decisão e não acaso. A suíte roda
  # contra um PostgreSQL efêmero do runner, semeado do zero a cada execução.
  # Apontá-la para o banco gerenciado seria pior de duas formas: exigiria a
  # credencial no CI e deixaria os testes escrevendo no mesmo banco de onde sai
  # a demonstração.
  #
  # A `FERNET_KEY` é gerada aqui mesmo, a cada execução, e morre com o runner.
  # A `JWT_SECRET` usa o padrão de desenvolvimento do `config.py`. A chave do
  # Gemini não entra: nenhum teste desta suíte dispara análise, e o seed não faz
  # chamada de rede.
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: lumina
          POSTGRES_PASSWORD: lumina
          POSTGRES_DB: lumina_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U lumina -d lumina_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql://lumina:lumina@localhost:5432/lumina_ci
      FLASK_APP: wsgi.py
      FLASK_ENV: dev
      LUMINA_DISABLE_SCHEDULER: '1'
      # Explícito, e não pelo padrão do `config.py`. O CORS do back-end libera
      # exatamente esta origem; se o front subir em outra, toda requisição
      # autenticada é bloqueada e a aplicação cai para a tela de login — o
      # sintoma não menciona CORS em lugar nenhum, e parece falha de sessão.
      # Aconteceu no ensaio local desta configuração, em 09/09.
      FRONTEND_ORIGIN: http://localhost:5173
    steps:
      - uses: actions/checkout@v4

      # A suíte vive aqui, mas fala com a API do outro repositório. Os dois são
      # públicos, então o checkout cruzado dispensa token.
      - uses: actions/checkout@v4
        with:
          repository: gustavoofranca/Lumina-Influence-AI-BE
          path: backend

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependências do back-end
        run: pip install -r backend/requirements.txt

      - name: Migrar e semear o banco efêmero
        working-directory: backend
        run: |
          echo "FERNET_KEY=$(python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')" >> "$GITHUB_ENV"
          flask db upgrade
          flask seed run

      - name: Subir a API
        working-directory: backend
        run: |
          nohup flask run --host=0.0.0.0 --port=5000 > /tmp/api.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5000/api/v1/health > /dev/null; then
              echo "API respondeu na tentativa $i"; exit 0
            fi
            sleep 2
          done
          echo "API não subiu em 60 s"; cat /tmp/api.log; exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Construir e servir o front
        run: |
          npm ci
          npm run build
          nohup npx vite preview --port 5173 > /tmp/front.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -sf http://localhost:5173/ > /dev/null; then
              echo "Front respondeu na tentativa $i"; exit 0
            fi
            sleep 2
          done
          echo "Front não subiu em 40 s"; cat /tmp/front.log; exit 1

      - name: Testes de ponta a ponta
        working-directory: e2e
        env:
          LUMINA_URL: http://localhost:5173
          LUMINA_API: http://localhost:5000/api/v1
        run: |
          npm ci
          npx playwright install --with-deps chrome
          npm test

      # O relatório é o que torna uma falha diagnosticável sem reproduzir
      # localmente: traço e captura de tela ficam anexados à execução.
      - name: Guardar o relatório quando falhar
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-e2e
          path: e2e/relatorio
          retention-days: 7
